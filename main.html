    .ttg *{box-sizing:border-box}
    .ttg-inner{max-width:1120px;margin:0 auto}
    .ttg-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-bottom:14px}
    .ttg-title{font-size:clamp(34px,7vw,82px);line-height:.9;letter-spacing:-.055em;font-weight:900;text-transform:uppercase;margin:0 0 18px;max-width:900px}
    .ttg-controls{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
    .ttg-mode{appearance:none;border:1px solid #2b2b2b;background:#0b0b0b;color:#8f8f8f;padding:11px 14px;min-height:44px;font:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}

    .ttg-slider-wrap{margin:0 0 26px}
    .ttg-slider-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:10px;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.08em}
    .ttg-slider{width:100%;accent-color:#e31717}
    .ttg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #2b2b2b;border-bottom:1px solid #2b2b2b}

    .ttg-actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:28px}
    .ttg-spin{appearance:none;border:0;background:#e31717;color:#fff;font:inherit;font-size:16px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:0 30px;min-height:64px;width:100%;cursor:pointer;border-radius:0;transition:transform .08s ease,background .15s ease}

    .ttg-save:focus-visible,.ttg-mode:focus-visible,.ttg-slider:focus-visible{outline:3px solid #fff;outline-offset:3px}

    .ttg-saved-title{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
    .ttg-saved-list{display:grid;gap:8px}
    .ttg-saved-item{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border:1px solid #1d1d1d;padding:12px 14px;color:#bdbdbd;font-size:13px;line-height:1.4}
    .ttg-remove{appearance:none;border:0;background:transparent;color:#666;font:inherit;cursor:pointer;padding:0 4px;min-width:32px;min-height:32px}
    .ttg-footer{margin-top:38px;padding-top:16px;border-top:1px solid #171717;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#555;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    .ttg-flash{animation:ttgFlash .18s ease}
    @keyframes ttgFlash{0%{opacity:.25;transform:translateY(5px)}100%{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.ttg-flash{animation:none}.ttg-spin{transition:none}}
    @media(max-width:720px){.ttg{padding:24px 16px 36px}.ttg-grid{grid-template-columns:1fr}.ttg-card{min-height:120px;border-right:0;border-bottom:1px solid #2b2b2b;padding:22px 4px}.ttg-card:last-child{border-bottom:0}.ttg-actions{grid-template-columns:1fr auto}.ttg-spin{width:100%}.ttg-mode{flex:1 1 calc(50% - 5px)}}
